services:
  # FastAPI Service using Dockerfile.api
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: dietitian-api
    ports:
      - "8000:8000"
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
    depends_on:
      - ollama
    networks:
      - dietitian-net
    restart: always

  ollama:
    image: ollama/ollama:latest
    container_name: dietitian-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - dietitian-net
    restart: unless-stopped

# Custom user-defined network allowing containers to resolve each other by name
networks:
  dietitian-net:
    driver: bridge

volumes:
  ollama_data: